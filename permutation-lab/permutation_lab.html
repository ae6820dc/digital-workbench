<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permutation Lab</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:800px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:16px}input,button{padding:10px;border:1px solid #ddd;border-radius:8px}pre{white-space:pre-wrap}</style></head><body><main><h1>🧩 Permutation Lab</h1><section><input id="s" value="ABC"><button onclick="go()">Generálás</button><p id="n"></p><pre id="o"></pre></section></main><script>function go(){let s=document.getElementById('s').value.split(''),out=[];function p(a,r=''){if(!a.length){out.push(r);return}a.forEach((v,i)=>p(a.slice(0,i).concat(a.slice(i+1)),r+v))}p(s);n.textContent='Összesen: '+out.length+' = '+s.length+'!';o.textContent=out.slice(0,10000).join('\n')+(out.length>10000?'\n… továbbiak elrejtve':'')}go()</script></body></html>
