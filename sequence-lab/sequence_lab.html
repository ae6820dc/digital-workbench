<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sequence Lab</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:800px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:16px}input,button{padding:10px;margin:5px;width:90%}</style></head><body><main><h1>🔢 Sequence Lab</h1><section><input id="s" value="1,3,5,7,9"><button onclick="go()">Elemzés</button><div id="o"></div></section></main><script>function go(){let a=s.value.split(',').map(Number),d=a.slice(1).map((v,i)=>v-a[i]),dd=d.slice(1).map((v,i)=>v-d[i]),type=d.every(x=>x===d[0])?'állandó első különbség':dd.every(x=>x===dd[0])?'állandó második különbség':'nem egyszerű polinomiális';let next=type==='állandó első különbség'?a.at(-1)+d[0]:type==='állandó második különbség'?a.at(-1)+d.at(-1)+dd[0]:'?';o.innerHTML='<h2>'+type+'</h2><p>Következő becslés: '+next+'</p><p>Különbségek: '+d.join(', ')+'</p>'}go()</script></body></html>
