<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timestamp Lab</title><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:700px;margin:auto;padding:24px}.box{background:#fff;border-radius:18px;padding:20px;border:1px solid #e5e7eb}input,button{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:10px}input{width:100%}button{margin-top:10px;cursor:pointer}.out{margin-top:16px;line-height:1.8;word-break:break-all}</style></head><body><main><h1>🕒 Timestamp Lab</h1><div class="box"><input id="n" type="number" placeholder="Unix timestamp másodpercben"><button onclick="go()">Dátum ↔ timestamp</button><div id="o" class="out"></div></div></main><script>function go(){let s=document.getElementById('n').value,o=document.getElementById('o');if(!s){let now=Date.now();o.innerHTML='Most: <b>'+new Date(now).toISOString()+'</b><br>Unix ms: <b>'+now+'</b><br>Unix s: <b>'+Math.floor(now/1000)+'</b>';return}let d=new Date(+s*1000);if(isNaN(d)){o.textContent='Érvénytelen timestamp.';return}o.innerHTML='UTC: <b>'+d.toISOString()+'</b><br>Helyi idő: <b>'+d.toLocaleString('hu-HU')+'</b>'}</script></body></html>
