<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hz & Frame Time</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.wrap{max-width:700px;margin:auto;padding:25px 16px}a{color:#2563eb;text-decoration:none}input{font:inherit;padding:13px;width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px}.out{background:white;margin-top:16px;padding:18px;border-radius:14px;line-height:1.8}</style></head><body><div class="wrap"><a href="../">← Workbench</a><h1>🖥️ Hz & Frame Time</h1><input id="h" type="number" min="0.001" step="any" value="60"><div class="out" id="o"></div></div><script>function go(){let x=+h.value;o.innerHTML='<b>Frissítés:</b> '+x+' Hz<br><b>1 képkocka ideje:</b> '+(1000/x).toFixed(6)+' ms<br><b>1 másodperc alatt:</b> '+x+' képkocka<br><b>1 Hz periódusa:</b> '+(1/x).toFixed(9)+' s';}h.oninput=go;go();</script></body></html>
