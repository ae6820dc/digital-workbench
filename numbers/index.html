<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Számvizsgáló</title><style>
body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.wrap{max-width:700px;margin:auto;padding:25px 16px}a{color:#2563eb;text-decoration:none}h1{margin:18px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #cbd5e1}input{width:100%;margin:8px 0 12px}button{background:#172033;color:white;cursor:pointer}.out{background:white;border-radius:14px;padding:16px;line-height:1.8;box-shadow:0 3px 14px #0001}</style></head><body><div class="wrap"><a href="../">← Workbench</a><h1>🔢 Számvizsgáló</h1><input id="n" type="number" step="1" placeholder="Írj be egy egész számot"><button onclick="go()">Vizsgálat</button><div id="o" class="out" style="margin-top:16px">Várom a számot…</div></div><script>
function go(){let s=document.getElementById('n').value,o=document.getElementById('o');if(s===''||!Number.isSafeInteger(+s)){o.textContent='Adj meg egy biztonságosan kezelhető egész számot.';return}let n=+s,a=Math.abs(n),prime=a>1;for(let i=2;i*i<=a&&prime;i++)if(a%i===0)prime=false;let digits=String(a).length,sum=[...String(a)].reduce((x,c)=>x+ +c,0);o.innerHTML=' <b>Érték:</b> '+n+'<br><b>Páros:</b> '+(n%2===0?'igen':'nem')+'<br><b>Prím:</b> '+(prime?'igen':'nem')+'<br><b>Számjegyek:</b> '+digits+'<br><b>Számjegyek összege:</b> '+sum+'<br><b>Négyzete:</b> '+n*n;}</script></body></html>
