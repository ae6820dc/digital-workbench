<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frequency Lab</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:800px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:16px}input{padding:10px;width:120px}canvas{width:100%;margin-top:15px;border:1px solid #ddd;border-radius:10px}</style></head><body><main><h1>🎛️ Frequency Lab</h1><section><input id="hz" type="number" value="60" min=".001"><button onclick="go()">Számol</button><h2 id="o"></h2><canvas id="c" width="760" height="250"></canvas></section></main><script>function go(){let f=+hz.value,o=document.getElementById('o'),c=document.getElementById('c'),x=c.getContext('2d');o.textContent='Periódus: '+(1000/f).toFixed(6)+' ms';x.clearRect(0,0,c.width,c.height);x.beginPath();for(let i=0;i<c.width;i++){let y=125+90*Math.sin(i/c.width*Math.PI*8);i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke()}go()</script></body></html>
