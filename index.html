<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>📦 Repository index</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#111827;color:#f3f4f6;font-family:Arial,sans-serif}
    .wrap{max-width:1000px;margin:auto;padding:32px 20px}
    h1{margin:0 0 8px} .path{color:#9ca3af;margin-bottom:20px}
    button,.item{font-size:16px;border:0;border-radius:10px;padding:12px 14px}
    button{background:#374151;color:white;cursor:pointer;margin-right:8px;margin-bottom:18px}
    .list{display:grid;gap:8px} .item{display:block;background:#1f2937;color:#f3f4f6;text-decoration:none;cursor:pointer}
    .item:hover{background:#374151} .folder{font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📦 Repository</h1>
    <div id="path" class="path">/</div>
    <button onclick="goHome()">🏠 Főkönyvtár</button>
    <button id="back" onclick="goBack()">⬅️ Vissza</button>
    <div id="list" class="list"></div>
  </div>
  <script>
    const tree = [{"name": "aspect-ratio-lab", "type": "dir", "children": [{"name": "aspect_ratio_lab.html", "type": "file"}]}, {"name": "bases", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "big-number-lab", "type": "dir", "children": [{"name": "big_number_lab.html", "type": "file"}]}, {"name": "binary-pattern-lab", "type": "dir", "children": [{"name": "binary_pattern_lab.html", "type": "file"}]}, {"name": "bits-bytes", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "bitwise-lab", "type": "dir", "children": [{"name": "bitwise_lab.html", "type": "file"}]}, {"name": "colors", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "combinatorics-lab", "type": "dir", "children": [{"name": "combinatorics_lab.html", "type": "file"}]}, {"name": "compression-simulator", "type": "dir", "children": [{"name": "compression_simulator.html", "type": "file"}]}, {"name": "coordinate-lab", "type": "dir", "children": [{"name": "coordinate_lab.html", "type": "file"}]}, {"name": "developer", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "encoding-lab", "type": "dir", "children": [{"name": "encoding_lab.html", "type": "file"}]}, {"name": "fractal-lab", "type": "dir", "children": [{"name": "fractal_lab.html", "type": "file"}]}, {"name": "fractions", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "frequency-lab", "type": "dir", "children": [{"name": "frequency_lab.html", "type": "file"}]}, {"name": "hash-lab", "type": "dir", "children": [{"name": "hash_lab.html", "type": "file"}]}, {"name": "html-entities", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "hz", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "image-data-lab", "type": "dir", "children": [{"name": "image_data_lab.html", "type": "file"}]}, {"name": "logic-gate-lab", "type": "dir", "children": [{"name": "logic_gate_lab.html", "type": "file"}]}, {"name": "math-visualizer", "type": "dir", "children": [{"name": "math_visualizer.html", "type": "file"}]}, {"name": "matrix-lab", "type": "dir", "children": [{"name": "matrix_lab.html", "type": "file"}]}, {"name": "numbers", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "perfect-hz", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "pixel-depth", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "primes", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "probability-lab", "type": "dir", "children": [{"name": "probability_lab.html", "type": "file"}]}, {"name": "random", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "regex", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "sequence-lab", "type": "dir", "children": [{"name": "sequence_lab.html", "type": "file"}]}, {"name": "stopwatch-lab", "type": "dir", "children": [{"name": "stopwatch_lab.html", "type": "file"}]}, {"name": "time", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "time-precision-lab", "type": "dir", "children": [{"name": "time_precision_lab.html", "type": "file"}]}, {"name": "timestamp", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}, {"name": "unicode", "type": "dir", "children": [{"name": "index.html", "type": "file"}]}];
    let current = [];

    function getItems(){
      let items = tree;
      for (const part of current) items = items.find(x => x.name === part).children;
      return items;
    }
    function render(){
      document.getElementById('path').textContent = '/' + current.join('/') + (current.length ? '/' : '');
      document.getElementById('back').style.display = current.length ? 'inline-block' : 'none';
      const list = document.getElementById('list');
      list.innerHTML = '';
      for (const item of getItems()){
        const el = document.createElement('a');
        el.className = 'item ' + (item.type === 'dir' ? 'folder' : '');
        el.textContent = (item.type === 'dir' ? '📁 ' : '📄 ') + item.name;
        if (item.type === 'dir') {
          el.href = '#';
          el.onclick = e => { e.preventDefault(); current.push(item.name); render(); };
        } else {
          const path = [...current, item.name].map(encodeURIComponent).join('/');
          el.href = path;
          el.target = '_blank';
        }
        list.appendChild(el);
      }
    }
    function goHome(){ current = []; render(); }
    function goBack(){ current.pop(); render(); }
    render();
  </script>
</body>
</html>
