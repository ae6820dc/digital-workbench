<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Lab</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.wrap{max-width:700px;margin:auto;padding:25px 16px}a{color:#2563eb;text-decoration:none}input{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:10px;width:100%;box-sizing:border-box}.sw{height:150px;border-radius:15px;margin:16px 0;border:1px solid #ddd}.out{background:white;padding:15px;border-radius:12px;line-height:1.8}</style></head><body><div class="wrap"><a href="../">← Workbench</a><h1>🎨 Color Lab</h1><input id="x" value="#3b82f6" maxlength="7"><div id="sw" class="sw"></div><div id="o" class="out"></div></div><script>function go(){let v=x.value.trim();if(!/^#[0-9a-f]{6}$/i.test(v)){o.textContent='Érvényes 6 jegyű HEX színt adj meg.';return}let r=parseInt(v.slice(1,3),16),g=parseInt(v.slice(3,5),16),b=parseInt(v.slice(5),16);sw.style.background=v;o.innerHTML='<b>HEX:</b> '+v.toUpperCase()+'<br><b>RGB:</b> '+r+', '+g+', '+b+'<br><b>24 bites érték:</b> '+((r<<16)|(g<<8)|b)+'<br><b>Csatornánként:</b> '+r+' / '+g+' / '+b; }x.oninput=go;go();</script></body></html>
