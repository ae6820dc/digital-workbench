<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combinatorics Lab</title><style>body{font-family:system-ui;margin:0;background:#eef1f5;color:#172033}main{max-width:900px;margin:auto;padding:20px}section{background:#fff;padding:20px;border-radius:16px;margin:12px 0;box-shadow:0 2px 10px #0001}input,select,button{padding:10px;border:1px solid #ccd3dc;border-radius:9px;font:inherit}button{cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}.card{padding:14px;background:#f6f7f9;border-radius:12px;margin-top:12px}#count{font-size:1.35rem;font-weight:700;word-break:break-all}pre{white-space:pre-wrap;max-height:350px;overflow:auto}</style></head><body><main><h1>🧩 Combinatorics Lab</h1><section><div class="row"><label>n <input id="n" type="number" min="0" value="8"></label><label>k <input id="k" type="number" min="0" value="3"></label><label>Típus <select id="t"><option value="p">Permutáció n!</option><option value="v">Variáció ismétlés nélkül</option><option value="vr">Variáció ismétléssel</option><option value="c">Kombináció</option><option value="cr">Kombináció ismétléssel</option></select></label></div><button onclick="calc()">Számolás</button><div class="card"><div id="formula"></div><div id="count"></div><div id="note"></div></div></section><section><h2>🔤 Konkrét elemek</h2><input id="s" value="ABCDEFGH" maxlength="12" style="width:min(100%,420px)"><button onclick="examples()">Példák</button><pre id="out"></pre></section></main><script>const fact=n=>{let r=1n;for(let i=2;i<=n;i++)r*=BigInt(i);return r};const C=(n,k)=>{if(k<0||k>n)return 0n;k=Math.min(k,n-k);let r=1n;for(let i=1;i<=k;i++)r=r*BigInt(n-k+i)/BigInt(i);return r};function val(n,k,t){if(t==='p')return fact(n);if(t==='v'){let r=1n;for(let i=0;i<k;i++)r*=BigInt(n-i);return r}if(t==='vr')return BigInt(n)**BigInt(k);if(t==='c')return C(n,k);return C(n+k-1,k)}function calc(){let n=+document.getElementById('n').value,k=+document.getElementById('k').value,t=document.getElementById('t').value;if(n<0||k<0||!Number.isInteger(n)||!Number.isInteger(k)||((t==='v'||t==='c')&&k>n)){count.textContent='Érvénytelen n/k';return}let names={p:'n!',v:'n!/(n-k)!',vr:'n^k',c:'n!/[k!(n-k)!]',cr:'C(n+k-1,k)'};formula.textContent='Képlet: '+names[t];count.textContent='Eredmény: '+val(n,k,t).toString();note.textContent=t==='p'&&n>9?'Csak a számot számoljuk ki; teljes felsorolás nincs.':''}function examples(){let a=[...s.value],t=document.getElementById('t').value,k=+document.getElementById('k').value,n=a.length;if(!a.length||k<0||k>n&&t!=='vr'&&t!=='cr'){out.textContent='Érvénytelen bemenet';return}let lines=[];function rec(prefix,rest,left){if(lines.length>=100) return;if(!left){lines.push(prefix.join(''));return}for(let i=0;i<rest.length&&lines.length<100;i++){let x=rest[i];rec(prefix.concat(x),t==='vr'||t==='cr'?rest:rest.slice(0,i).concat(rest.slice(i+1)),left-1)}}rec([],a,k|| (t==='p'?n:0));out.textContent=lines.join('\n')+(lines.length===100?'\n… legfeljebb 100 példa':'')}calc()</script></body></html>
