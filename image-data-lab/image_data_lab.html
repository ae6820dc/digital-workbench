<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Data Lab</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:800px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:16px}input{margin:10px 0}img{max-width:100%;margin-top:15px;border-radius:10px}#o{line-height:1.8}</style></head><body><main><h1>🖼️ Image Data Lab</h1><section><input id="f" type="file" accept="image/*"><div id="o"></div><img id="im"></section></main><script>f.onchange=()=>{let file=f.files[0];if(!file)return;let u=URL.createObjectURL(file);im.src=u;im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;document.getElementById('o').innerHTML='Felbontás: '+w+' × '+h+'<br>Pixelek: '+(w*h).toLocaleString()+'<br>Fájlméret: '+(file.size/1024).toFixed(2)+' KiB<br>Arány: '+(w/h).toFixed(6)+'<br>Becsült nyers RGBA: '+(w*h*4/1048576).toFixed(2)+' MiB'}};</script></body></html>
