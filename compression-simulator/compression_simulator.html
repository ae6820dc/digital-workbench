<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compression Simulator</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:800px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:16px}textarea,button{width:100%;padding:12px;box-sizing:border-box;margin:6px 0;border-radius:8px;border:1px solid #ddd}pre{white-space:pre-wrap}</style></head><body><main><h1>🗜️ Compression Simulator</h1><section><textarea id="t" rows="5" placeholder="AAAAABBBCCDAA"></textarea><button onclick="go()">RLE tömörítés</button><pre id="o"></pre></section></main><script>function go(){let s=t.value,r='',i=0;while(i<s.length){let j=i+1;while(j<s.length&&s[j]===s[i])j++;r+=(j-i)+s[i];i=j}o.textContent='Eredeti: '+s.length+' karakter\nRLE: '+r+'\nTömörített hossz: '+r.length}</script></body></html>
