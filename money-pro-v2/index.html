<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Pro 2</title><style>body{margin:0;background:#08111f;color:#f4f7fb;font-family:system-ui;padding:16px}.app{max-width:700px;margin:auto;padding-bottom:90px}.top,.month,.title{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:13px;background:#2563eb;display:grid;place-items:center;font-size:22px}button,input,select{font:inherit}button{border:1px solid #263750;background:#111d30;color:#fff;border-radius:11px;padding:11px}.card{background:#101d30;border:1px solid #263750;border-radius:17px}.hero{padding:17px;margin:12px 0}.muted,small{color:#8fa0b8}.balance{font-size:34px;font-weight:800;margin:4px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini,.stat{padding:11px;background:#ffffff08;border-radius:12px}.mini b,.stat b{display:block;margin-top:3px}.green{color:#35d07f}.red{color:#ff6876}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.primary{background:#2563eb}.section{margin-top:16px}.row{display:flex;gap:9px;align-items:center;padding:11px;border-bottom:1px solid #263750}.row:last-child{border:0}.emoji{width:38px;height:38px;background:#ffffff09;border-radius:10px;display:grid;place-items:center}.main{flex:1;min-width:0}.main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.amount{font-weight:800;font-size:13px}.del{padding:7px}.empty{text-align:center;padding:22px;color:#8fa0b8}.bars{height:130px;display:flex;align-items:end;gap:6px;padding:15px}.bar{flex:1;background:#2563eb;min-width:4px;border-radius:5px;position:relative}.bar span{position:absolute;top:100%;font-size:9px;color:#8fa0b8}.view{display:none}.view.active{display:block}.filters{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-bottom:9px}.input,.select,.field input,.field select{width:100%;padding:11px;background:#101d30;color:#fff;border:1px solid #263750;border-radius:10px}.nav{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:min(690px,calc(100% - 16px));display:grid;grid-template-columns:repeat(4,1fr);background:#101d30f5;border:1px solid #263750;border-radius:17px;padding:5px}.nav button{border:0;background:none;font-size:10px;color:#8fa0b8}.nav .active{color:#fff;background:#ffffff0c}.nav i{display:block;font-style:normal;font-size:19px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;padding:10px}.modal.show{display:flex}.sheet{width:min(600px,100%);background:#101d30;border:1px solid #263750;border-radius:20px;padding:16px}.field{margin-bottom:10px}.field label{display:block;font-size:11px;color:#8fa0b8;margin-bottom:4px}.sheetBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save{background:#2563eb;font-weight:700}@media(min-width:700px){.actions{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">💰</div><div><h1>Money Pro 2</h1><small>stabil mobil pénzügyi napló</small></div></div><button id="settings">⚙️</button></header><section id="home" class="view active"><div class="month"><button id="prev">‹</button><b id="monthName"></b><button id="next">›</button></div><div class="card hero"><small>Egyenleg · <span id="cur">HUF</span></small><div class="balance" id="balance">0 Ft</div><div class="grid"><div class="mini"><small>Bevétel</small><b class="green" id="income">+0 Ft</b></div><div class="mini"><small>Kiadás</small><b class="red" id="expense">−0 Ft</b></div></div></div><div class="actions"><button class="primary" id="addIn">＋ Bevétel</button><button id="addOut">− Kiadás</button><button id="goTx">☷ Tételek</button><button id="backup">📤 Mentés</button></div><div class="section"><div class="title"><b>Legutóbbi tételek</b><small id="count"></small></div><div class="card" id="recent"></div></div><div class="section"><div class="title"><b>Kiadási trend</b><small>6 hónap</small></div><div class="card bars" id="bars"></div></div></section><section id="tx" class="view"><div class="title"><h2>Tranzakciók</h2><small id="txCount"></small></div><div class="filters"><input class="input" id="search" placeholder="🔎 Keresés"><select class="select" id="filter"><option value="all">Minden típus</option><option value="income">Bevétel</option><option value="expense">Kiadás</option></select></div><div class="card" id="all"></div></section><section id="stats" class="view"><div class="title"><h2>Elemzés</h2><small id="statMonth"></small></div><div class="grid"><div class="stat"><small>Bevétel</small><b id="si">0</b></div><div class="stat"><small>Kiadás</small><b id="so">0</b></div><div class="stat"><small>Átlagos kiadás</small><b id="sa">0</b></div><div class="stat"><small>Legnagyobb kiadás</small><b id="sm">0</b></div></div></section><section id="set" class="view"><h2>Beállítások</h2><div class="card" style="padding:15px"><div class="field"><label>Pénznem</label><select id="currency"><option>HUF</option><option>EUR</option><option>USD</option><option>GBP</option><option>CHF</option></select></div><button class="save" id="saveSet">Mentés</button></div></section></div><nav class="nav"><button class="active" data-v="home"><i>⌂</i>Főoldal</button><button data-v="tx"><i>☷</i>Tételek</button><button data-v="stats"><i>◔</i>Elemzés</button><button data-v="set"><i>⚙</i>Beállítások</button></nav><div class="modal" id="modal"><div class="sheet"><h2 id="mt">Új tétel</h2><div class="field"><label>Megnevezés</label><input id="desc" placeholder="pl. Bevásárlás"></div><div class="field"><label>Összeg</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="field"><label>Dátum</label><input id="date" type="date"></div><div class="field"><label>Kategória</label><select id="cat"><option>Élelmiszer</option><option>Lakhatás</option><option>Közlekedés</option><option>Szórakozás</option><option>Vásárlás</option><option>Egészség</option><option>Munka</option><option>Számla</option><option>Egyéb</option></select></div><div class="sheetBtns"><button id="cancel">Mégse</button><button class="save" id="save">Mentés</button></div></div></div><script>
const KEY='money-pro-v2',S={HUF:'Ft',EUR:'€',USD:'$',GBP:'£',CHF:'Fr'};let d={currency:'HUF',items:[]},m=new Date(),kind='income';m.setDate(1);const $=x=>document.getElementById(x);
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x==='object')d=x}catch(e){}if(!S[d.currency])d.currency='HUF';if(!Array.isArray(d.items))d.items=[];d.items=d.items.filter(x=>x&&Number(x.amount)>0&&(x.kind==='income'||x.kind==='expense')&&typeof x.date==='string'&&x.date.length===10)}
function save(){localStorage.setItem(KEY,JSON.stringify(d))}
function money(n){return new Intl.NumberFormat('hu-HU',{maximumFractionDigits:d.currency==='HUF'?0:2}).format(n)+' '+S[d.currency]}
function monthKey(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function today(){const x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(x){return x==='income'?'💵':({Élelmiszer:'🛒',Lakhatás:'🏠',Közlekedés:'🚗',Szórakozás:'🎮',Vásárlás:'🛍️',Egészség:'💊',Munka:'💼',Számla:'🧾',Egyéb:'•'})[x]||'•'}
function row(x){return '<div class="row"><div class="emoji">'+icon(x.kind)+'</div><div class="main"><b>'+esc(x.desc)+'</b><small>'+x.date+' · '+esc(x.cat)+'</small></div><span class="amount '+(x.kind==='income'?'green':'red')+'">'+(x.kind==='income'?'+':'−')+money(x.amount)+'</span><button class="del" data-id="'+x.id+'">🗑️</button></div>'}
function render(){const k=monthKey(m),a=d.items.filter(x=>x.date.slice(0,7)===k),inc=a.filter(x=>x.kind==='income').reduce((s,x)=>s+x.amount,0),out=a.filter(x=>x.kind==='expense').reduce((s,x)=>s+x.amount,0);$('monthName').textContent=m.toLocaleDateString('hu-HU',{year:'numeric',month:'long'});$('statMonth').textContent=$('monthName').textContent;$('cur').textContent=d.currency;$('balance').textContent=money(inc-out);$('income').textContent='+'+money(inc);$('expense').textContent='−'+money(out);$('count').textContent=a.length+' tétel';$('recent').innerHTML=a.slice().sort((x,y)=>y.date.localeCompare(x.date)).slice(0,6).map(row).join('')||'<div class="empty">Nincs tétel ebben a hónapban.</div>';const q=$('search').value.toLowerCase(),f=$('filter').value,z=d.items.filter(x=>(f==='all'||x.kind===f)&&((x.desc+' '+x.cat).toLowerCase().includes(q))).sort((x,y)=>y.date.localeCompare(x.date));$('txCount').textContent=z.length+' találat';$('all').innerHTML=z.map(row).join('')||'<div class="empty">Nincs találat.</div>';const e=a.filter(x=>x.kind==='expense');$('si').textContent=money(inc);$('so').textContent=money(out);$('sa').textContent=money(e.length?out/e.length:0);$('sm').textContent=money(e.length?Math.max(...e.map(x=>x.amount)):0);const v=[];for(let i=5;i>=0;i--){const q=new Date(m);q.setMonth(q.getMonth()-i),kk=monthKey(q),n=d.items.filter(x=>x.kind==='expense'&&x.date.slice(0,7)===kk).reduce((s,x)=>s+x.amount,0);v.push({q,n})}const mx=Math.max(...v.map(x=>x.n),1);$('bars').innerHTML=v.map(x=>'<div class="bar" style="height:'+Math.max(5,x.n/mx*105)+'px"><span>'+x.q.toLocaleDateString('hu-HU',{month:'short'}).replace('.','')+'</span></div>').join('')}
function view(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));render()}
function pass(){const p=prompt('Jelszó szükséges a módosításhoz:');return p==='1111'}function form(k){if(!pass())return;kind=k;$('mt').textContent=k==='income'?'＋ Új bevétel':'− Új kiadás';$('desc').value='';$('amount').value='';$('date').value=today();$('modal').classList.add('show');$('desc').focus()}
document.querySelectorAll('.nav button').forEach(x=>x.onclick=()=>view(x.dataset.v));$('addIn').onclick=()=>form('income');$('addOut').onclick=()=>form('expense');$('goTx').onclick=()=>view('tx');$('settings').onclick=()=>view('set');$('cancel').onclick=()=>$('modal').classList.remove('show');$('save').onclick=()=>{const desc=$('desc').value.trim(),amount=Number($('amount').value),date=$('date').value;if(!desc||!(amount>0)||!date)return alert('Tölts ki minden mezőt.');d.items.push({id:String(Date.now()+Math.random()),desc,amount,kind,date,cat:$('cat').value});save();$('modal').classList.remove('show');render()};$('prev').onclick=()=>{m.setMonth(m.getMonth()-1);render()};$('next').onclick=()=>{m.setMonth(m.getMonth()+1);render()};$('search').oninput=render;$('filter').onchange=render;document.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b&&pass()&&confirm('Törlöd ezt a tételt?')){d.items=d.items.filter(x=>x.id!==b.dataset.id);save();render()}});$('saveSet').onclick=()=>{if(!pass())return;d.currency=$('currency').value;save();render();alert('Beállítások mentve.')};$('backup').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='money-pro-2-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};load();$('currency').value=d.currency;render();
</script></body></html>
