<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sequence Studio</title><style>*{box-sizing:border-box}body{font:16px system-ui,sans-serif;color:#171717;background:#fff;margin:0;padding:24px}main{max-width:760px;margin:auto}h1{font-size:24px}section{border:1px solid #ddd;border-radius:20px;padding:20px}.muted,label{color:#666}.tiles{display:flex;flex-wrap:wrap;gap:5px;margin:16px 0 24px}.tiles span{background:#eee;border-radius:12px;padding:12px 10px;font-weight:700;font-size:20px}hr{border:0;border-top:1px solid #ddd;margin:24px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 12px}.value{font-size:26px;font-weight:700;margin-top:10px;overflow-wrap:anywhere}.line{display:flex;justify-content:space-between;align-items:center;gap:12px}input[type=text]{width:45%;font:700 24px system-ui;text-align:right;border:1px solid #ddd;border-radius:8px;padding:6px}input[type=range]{width:100%;accent-color:#222;margin:24px 0}button{font:600 16px system-ui;border:1px solid #ddd;border-radius:30px;padding:13px;background:white;color:#555;cursor:pointer;width:100%}button.primary{background:#171717;color:white;border-color:#171717}button:disabled{opacity:.4}.actions{display:flex;gap:8px;margin-top:12px}#error{color:#a22;font-size:14px}</style><main><h1>Építsd meg a saját számsorozatodat!</h1><section><div class="muted">Saját számsorozatod</div><div class="tiles" id="tiles"></div><hr><div class="grid"><div><div class="muted">Hézagmentes tartomány</div><div class="value" id="range"></div></div><div><div class="muted">Elemek száma</div><div class="value" id="count"></div></div><div><div class="muted">Lehetséges kombinációk</div><div class="value" id="comb"></div></div><div><div class="muted">Következő megengedett érték</div><div class="value" id="allowed"></div></div></div><hr><div class="line"><label for="pick">Következő saját számod</label><input id="pick" type="text" inputmode="numeric"></div><input id="slider" type="range" aria-label="Következő szám"><div id="error" role="status"></div><button class="primary" id="add">Szám hozzáadása</button><div class="actions"><button id="undo">Visszavonás</button><button id="reset">Újrakezdés</button></div></section></main><script>const $=id=>document.getElementById(id),key='8f3a91c7d024be65',fmt=x=>x.toLocaleString('hu-HU');let a=[1n,2n],lo,hi;try{let b=JSON.parse(localStorage.getItem(key)).map(BigInt),s=0n;if(b.length>=2&&b[0]===1n&&b.every((x,i)=>{let ok=x>0n&&x<=s+1n&&(!i||x>b[i-1]);s+=x;return ok}))a=b}catch{}function render(p){let s=a.reduce((x,y)=>x+y,0n);lo=a.at(-1)+1n;hi=s+1n;$('tiles').replaceChildren(...a.map(x=>{let e=document.createElement('span');e.textContent=fmt(x);return e}));$('range').textContent='0–'+fmt(s);$('count').textContent=a.length;$('comb').textContent=fmt(2n**BigInt(a.length));$('allowed').textContent=fmt(lo)+'–'+fmt(hi);$('slider').min=0;$('slider').max=String(hi-lo>10000n?10000n:hi-lo);$('pick').value=String(p??lo);$('undo').disabled=a.length<=2;validate();try{localStorage.setItem(key,JSON.stringify(a.map(String)))}catch{}}function validate(){let x=null;try{if(/^\d+$/.test($('pick').value))x=BigInt($('pick').value)}catch{}let ok=x!==null&&x>=lo&&x<=hi;$('add').disabled=!ok;$('error').textContent=ok?'':'A megengedett tartományból válassz.';if(ok)$('slider').value=String(hi===lo?0n:(x-lo)*BigInt($('slider').max)/(hi-lo));return ok?x:null}$('pick').oninput=validate;$('slider').oninput=()=>{$('pick').value=String(lo+(hi-lo)*BigInt($('slider').value)/(BigInt($('slider').max)||1n));validate()};$('add').onclick=()=>{let x=validate();if(x!==null){a.push(x);render()}};$('undo').onclick=()=>{if(a.length>2){let x=a.pop();render(x)}};$('reset').onclick=()=>{a=[1n,2n];render()};render();</script></html>
