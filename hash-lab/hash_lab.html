<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hash Lab</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:800px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:16px}textarea,select,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border:1px solid #ddd;border-radius:8px}pre{white-space:pre-wrap;word-break:break-all}</style></head><body><main><h1>🔐 Hash Lab</h1><section><textarea id="t" rows="6" placeholder="Írj be valamit..."></textarea><select id="alg"><option>SHA-256</option><option>SHA-384</option><option>SHA-512</option></select><button onclick="go()">Hash számítása</button><pre id="o"></pre></section></main><script>async function go(){let d=new TextEncoder().encode(document.getElementById('t').value),a=document.getElementById('alg').value,b=await crypto.subtle.digest(a,d);document.getElementById('o').textContent=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}</script></body></html>
