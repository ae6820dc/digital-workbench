<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logic Gate Lab</title><style>body{font-family:system-ui;margin:0;background:#eef1f5;color:#172033}main{max-width:850px;margin:auto;padding:20px}section{background:#fff;padding:20px;border-radius:16px;margin:12px 0}select,input,button{padding:10px;border:1px solid #ccd3dc;border-radius:9px;font:inherit}table{border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ccd3dc;padding:9px;text-align:center}.on{font-weight:700}</style></head><body><main><h1>🧩 Logic Gate Lab</h1><section><select id="g"><option>AND</option><option>OR</option><option>XOR</option><option>NAND</option><option>NOR</option><option>XNOR</option></select><button onclick="go()">Igazságtábla</button><div id="o"></div></section></main><script>function f(g,a,b){return g==='AND'?a&b:g==='OR'?a|b:g==='XOR'?a^b:g==='NAND'?!(a&b):g==='NOR'?!(a|b):!(a^b)}function go(){let h='<table><tr><th>A</th><th>B</th><th>'+g.value+'</th></tr>';for(let a=0;a<2;a++)for(let b=0;b<2;b++)h+='<tr><td>'+a+'</td><td>'+b+'</td><td class="on">'+(f(g.value,a,b)?1:0)+'</td></tr>';o.innerHTML=h+'</table>'}go()</script></body></html>
