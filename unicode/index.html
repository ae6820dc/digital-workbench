<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unicode Explorer</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.wrap{max-width:700px;margin:auto;padding:25px 16px}a{color:#2563eb;text-decoration:none}input{font:inherit;padding:14px;width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px}.box{background:white;margin-top:16px;padding:22px;border-radius:14px;text-align:center}.char{font-size:80px}</style></head><body><div class="wrap"><a href="../">← Workbench</a><h1>🔤 Unicode Explorer</h1><input id="x" placeholder="Írj be egy karaktert…" maxlength="2" oninput="go()"><div class="box"><div id="c" class="char">?</div><div id="o">A karakter adatai itt jelennek meg.</div></div></div><script>function go(){let s=document.getElementById('x').value;if(!s)return;let c=[...s][0],cp=c.codePointAt(0);document.getElementById('c').textContent=c;document.getElementById('o').innerHTML='<b>Karakter:</b> '+c+'<br><b>Unicode:</b> U+'+cp.toString(16).toUpperCase().padStart(4,'0')+'<br><b>Decimális:</b> '+cp+'<br><b>HTML:</b> &amp;#'+cp+';';}</script></body></html>
