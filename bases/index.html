<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base Converter</title><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:700px;margin:auto;padding:24px}.box{background:white;border-radius:18px;padding:20px;border:1px solid #e5e7eb}input,select,button{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:10px}input{width:100%;margin-bottom:12px}button{cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.out{margin-top:18px;line-height:1.8;word-break:break-all}</style></head><body><main><h1>🔣 Base Converter</h1><div class="box"><input id="n" placeholder="Pl. 255"><div class="row"><select id="from"><option value="10">Decimális</option><option value="2">Bináris</option><option value="8">Oktális</option><option value="16">Hexadecimális</option></select><button onclick="go()">Átváltás</button></div><div id="o" class="out"></div></div></main><script>function go(){let s=document.getElementById('n').value.trim(),b=+document.getElementById('from').value,o=document.getElementById('o'),n=parseInt(s,b);if(!s||!Number.isFinite(n)){o.textContent='Érvénytelen szám.';return}o.innerHTML='Dec: <b>'+n+'</b><br>Bin: <b>'+n.toString(2)+'</b><br>Oct: <b>'+n.toString(8)+'</b><br>Hex: <b>'+n.toString(16).toUpperCase()+'</b>';}</script></body></html>
