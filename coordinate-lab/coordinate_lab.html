<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coordinate Lab</title><style>body{font-family:system-ui;margin:0;background:#eef1f5;color:#172033}main{max-width:850px;margin:auto;padding:20px}section{background:#fff;padding:20px;border-radius:16px;margin:12px 0}input,button{padding:10px;border:1px solid #ccd3dc;border-radius:9px;font:inherit}.row{display:flex;gap:8px;flex-wrap:wrap}.canvas{height:280px;background:#f5f6f8;border-radius:12px;position:relative;overflow:hidden}canvas{width:100%;height:100%}</style></head><body><main><h1>🌌 Coordinate Lab</h1><section><div class="row"><input id="x1" type="number" value="2"><input id="y1" type="number" value="3"><input id="x2" type="number" value="8"><input id="y2" type="number" value="9"><button onclick="go()">Számol</button></div><p id="r"></p><div class="canvas"><canvas id="c"></canvas></div></section></main><script>function go(){let x1=+x1e.value,y1=+y1e.value,x2=+x2e.value,y2=+y2e.value,dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;r.textContent='Δx='+dx+' | Δy='+dy+' | távolság='+d.toFixed(6)+' | szög='+ang.toFixed(3)+'°';let w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio,ctx=c.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);ctx.translate(w/(2*devicePixelRatio),h/(2*devicePixelRatio));ctx.scale(18,-18);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}const x1e=document.getElementById('x1'),y1e=document.getElementById('y1'),x2e=document.getElementById('x2'),y2e=document.getElementById('y2');go()</script></body></html>
