<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entropy Map</title><style>
body{margin:0;background:#0b1016;color:#e5edf5;font:14px system-ui;padding:18px}main{max-width:1000px;margin:auto}h1{margin-bottom:4px}.panel{background:#121a23;border:1px solid #2a3948;border-radius:14px;padding:15px;margin:12px 0}.drop{display:block;border:2px dashed #40566b;border-radius:12px;padding:25px;text-align:center;cursor:pointer}input{display:none}canvas{width:100%;height:300px;background:#090d12;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #263442;text-align:left;font-family:ui-monospace,monospace}.muted{color:#91a4b7}@media(max-width:650px){canvas{height:220px}table{font-size:12px}}</style></head><body><main><h1>📊 Entropy Map</h1><p class=muted>Fájlon belüli szerkezeti változások blokkos entrópia-térképe.</p><div class=panel><label class=drop>📂 Fájl kiválasztása<input id=f type=file></label><p id=m></p></div><div class=panel><canvas id=c width=1000 height=300></canvas></div><div class=panel><table><thead><tr><th>Blokk</th><th>Offset</th><th>Byte</th><th>Entrópia</th></tr></thead><tbody id=t></tbody></table></div></main><script>
const f=document.querySelector('#f'),c=document.querySelector('#c'),ctx=c.getContext('2d');f.onchange=()=>{let file=f.files[0];if(!file)return;let r=new FileReader;r.onload=()=>go(new Uint8Array(r.result),file);r.readAsArrayBuffer(file)};
function ent(a){let q=new Uint32Array(256);for(let x of a)q[x]++;let e=0;for(let n of q)if(n){let p=n/a.length;e-=p*Math.log2(p)}return e}
function go(a,file){document.querySelector('#m').textContent=file.name+' · '+a.length.toLocaleString()+' byte';let size=Math.max(256,Math.ceil(a.length/Math.min(512,Math.max(1,Math.floor(a.length/256))))),arr=[];for(let i=0;i<a.length;i+=size)arr.push(ent(a.subarray(i,Math.min(i+size,a.length))));let max=8,w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#263544';for(let y=0;y<=8;y+=2){let py=h-y/8*h;ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(w,py);ctx.stroke();ctx.fillStyle='#91a4b7';ctx.fillText(y.toFixed(0),5,py-3)}ctx.beginPath();arr.forEach((v,i)=>{let x=i/(arr.length-1||1)*w,y=h-v/max*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#9fc1dd';ctx.lineWidth=2;ctx.stroke();document.querySelector('#t').innerHTML=arr.map((v,i)=>'<tr><td>'+(i+1)+'</td><td>0x'+(i*size).toString(16).padStart(8,'0').toUpperCase()+'</td><td>'+Math.min(size,a.length-i*size)+'</td><td>'+v.toFixed(4)+' bit</td></tr>').join('')}</script></body></html>
