<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfect Hz Finder</title><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:760px;margin:auto;padding:24px}.box{background:#fff;border-radius:18px;padding:20px;border:1px solid #e5e7eb}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,button{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:10px}button{cursor:pointer;margin-top:10px}.out{margin-top:16px;line-height:1.8}</style></head><body><main><h1>🎯 Perfect Hz Finder</h1><p>Megkeresi azokat az Hz értékeket, amelyeknél az 1/Hz tizedes alakja véges.</p><div class="box"><div class="row"><input id="a" type="number" value="30"><input id="b" type="number" value="160"></div><button onclick="go()">Keresés</button><div id="o" class="out"></div></div></main><script>function finite(n){while(n%2===0)n/=2;while(n%5===0)n/=5;return n===1}function go(){let a=Math.max(1,Math.floor(+document.getElementById('a').value)),b=Math.min(100000,Math.floor(+document.getElementById('b').value)),o=document.getElementById('o');if(a>b){o.textContent='A kezdőérték legyen kisebb.';return}let r=[];for(let n=a;n<=b;n++)if(finite(n))r.push(n);o.innerHTML='Talált értékek: <b>'+r.length+'</b><br>'+r.join(', ');}</script></body></html>
