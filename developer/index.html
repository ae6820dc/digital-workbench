<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer Tools</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.wrap{max-width:800px;margin:auto;padding:25px 16px}a{color:#2563eb;text-decoration:none}textarea{width:100%;height:150px;box-sizing:border-box;font:14px monospace;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{font:inherit;padding:10px 13px;border:0;border-radius:9px;background:#172033;color:white}.out{white-space:pre-wrap;background:white;padding:14px;border-radius:10px;min-height:80px}</style></head><body><div class="wrap"><a href="../">← Workbench</a><h1>🧰 Developer Tools</h1><textarea id="i" placeholder="Ide jöhet a szöveg vagy JSON…"></textarea><div class="row"><button onclick="json()">JSON formázás</button><button onclick="enc()">Base64 kódolás</button><button onclick="dec()">Base64 dekódolás</button><button onclick="urlenc()">URL encode</button><button onclick="urldec()">URL decode</button></div><div id="o" class="out"></div></div><script>const out=x=>o.textContent=x;function json(){try{out(JSON.stringify(JSON.parse(i.value),null,2))}catch(e){out('Hibás JSON.')}}function enc(){out(btoa(unescape(encodeURIComponent(i.value))))}function dec(){try{out(decodeURIComponent(escape(atob(i.value))))}catch(e){out('Hibás Base64.')}}function urlenc(){out(encodeURIComponent(i.value))}function urldec(){try{out(decodeURIComponent(i.value))}catch(e){out('Hibás URL-kódolás.')}}</script></body></html>
