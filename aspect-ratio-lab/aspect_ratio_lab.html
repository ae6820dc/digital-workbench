<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aspect Ratio Lab</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:700px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:16px}input,button{padding:10px;margin:5px;border:1px solid #ddd;border-radius:8px}.box{margin-top:20px;background:#e5e7eb;max-width:500px;aspect-ratio:16/9;border-radius:10px}</style></head><body><main><h1>📐 Aspect Ratio Lab</h1><section><input id="w" type="number" value="1920"><input id="h" type="number" value="1080"><button onclick="go()">Számol</button><h2 id="o"></h2><div id="box" class="box"></div></section></main><script>function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}function go(){let w=+wEl.value,h=+hEl.value,g=gcd(w,h),r=w/h;o.textContent=w+':'+h+' = '+w/g+':'+h/g+' | '+r.toFixed(6);box.style.aspectRatio=w+'/'+h}let wEl=document.getElementById('w'),hEl=document.getElementById('h'),o=document.getElementById('o'),box=document.getElementById('box');go()</script></body></html>
