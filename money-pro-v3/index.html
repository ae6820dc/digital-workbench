<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f"><title>Money Pro 3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111f;color:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.app{max-width:760px;margin:auto;padding:14px 12px 92px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:13px;background:#2563eb;display:grid;place-items:center;font-size:22px}.brand h1{font-size:21px;margin:0}.muted,small{color:#8fa0b8}.btn{border:1px solid #263750;background:#111d30;color:#fff;border-radius:11px;padding:10px 12px;font-weight:700}.card{background:#101d30;border:1px solid #263750;border-radius:17px}.asof{padding:12px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:8px}.asof label{grid-column:1/-1;color:#8fa0b8;font-size:12px}.asof input{width:100%;padding:10px;border-radius:10px;border:1px solid #263750;background:#08111f;color:#fff}.summary{display:grid;gap:10px}.currency{overflow:hidden}.chead{padding:9px 13px;background:#182941;display:flex;justify-content:space-between;align-items:center}.cbody{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#263750}.cell{background:#101d30;padding:11px 13px}.cell.balance{grid-column:1/-1}.label{font-size:10px;color:#8fa0b8;text-transform:uppercase}.value{font-size:18px;font-weight:800;margin-top:3px;word-break:break-word}.income{color:#35d07f}.expense{color:#ff6876}.positive{color:#35d07f}.negative{color:#ff6876}.zero{color:#8fa0b8}.form{margin-top:10px;padding:12px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.form input,.form select{min-width:0;width:100%;padding:11px;border-radius:10px;border:1px solid #263750;background:#08111f;color:#fff}.form .desc{grid-column:span 2}.form .submit{background:#2563eb;border-color:#2563eb}.tools{margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.tools button{width:100%}.table{margin-top:12px;display:grid;gap:9px}.tx{position:relative;padding:12px}.tx.future{background:#241e0b}.txgrid{display:grid;grid-template-columns:1fr auto;gap:4px 10px}.txdesc{font-weight:700;word-break:break-word}.txdate{font-size:12px;color:#8fa0b8}.txamount{font-weight:800;text-align:right;grid-row:1/3;align-self:center}.txmeta{font-size:11px;color:#8fa0b8}.delete{position:absolute;right:9px;top:9px;border:1px solid #56343a;background:#25151a;color:#ff9ca5;border-radius:8px;padding:7px}.futureBadge{font-size:9px;background:#f39c12;color:#111;padding:2px 5px;border-radius:5px;margin-left:5px}.empty{text-align:center;padding:25px;color:#8fa0b8}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:20}.modal.show{display:flex}.sheet{width:min(600px,100%);max-height:90vh;overflow:auto;background:#101d30;border:1px solid #263750;border-radius:20px;padding:17px}.sheet h2{margin:0 0 10px}.sheet p{color:#8fa0b8}.sheet input,.sheet textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #263750;background:#08111f;color:#fff;margin:7px 0 12px}.sheetBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger{background:#c0392b!important}.blue{background:#2563eb!important}.hidden{display:none}@media(max-width:600px){.form{grid-template-columns:1fr 1fr}.form .desc{grid-column:1/-1}.form .submit{grid-column:1/-1;min-height:46px}.tools{grid-template-columns:1fr 1fr}.tools .clear{grid-column:1/-1}.cbody{grid-template-columns:1fr}.cell.balance{grid-column:1}.asof{grid-template-columns:1fr}.asof button{width:100%}.modal{align-items:flex-end}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">💰</div><div><h1>Money Pro 3</h1><small>Multi-valutás pénzügyi nyilvántartó</small></div></div><button class="btn" id="settings">⚙️</button></header>

<section class="card asof"><label>Állapot dátuma — ezen a dátumon vagy korábban érvényes tételek</label><div><input id="asof" type="date"></div><button class="btn" id="today">Mai nap</button></section>
<section id="summary" class="summary"></section>

<section class="card form">
<input class="desc" id="desc" placeholder="Leírás">
<input id="amount" type="number" min="0.00000001" step="any" placeholder="Összeg" inputmode="decimal">
<select id="currency"></select>
<select id="kind"><option value="income">Bevétel</option><option value="expense">Kiadás</option></select>
<input id="date" type="date">
<button class="btn submit" id="add">🔒 Hozzáadás</button>
</section>

<section class="tools">
<button class="btn" id="export">📤 Export</button><button class="btn" id="import">📥 Import</button><button class="btn clear" id="clear">🗑️ Összes törlése</button>
</section>

<section class="table" id="list"></section>
</div>

<div class="modal" id="passwordModal"><div class="sheet"><h2>🔐 Jelszó</h2><p>Minden módosítás védett. A jelszó: <b>1111</b></p><input id="password" type="password" inputmode="numeric" autocomplete="off" placeholder="Jelszó"><div class="sheetBtns"><button class="btn" id="pCancel">Mégse</button><button class="btn blue" id="pOk">Megerősítés</button></div></div></div>
<div class="modal" id="importModal"><div class="sheet"><h2>📥 Import</h2><p>JSON mentés betöltése. A meglévő adatokhoz hozzáadhatod vagy lecserélheted őket.</p><input id="file" type="file" accept=".json,application/json"><div class="sheetBtns"><button class="btn" id="iCancel">Mégse</button><button class="btn blue" id="iOk">Importálás</button></div></div></div>
<div class="modal" id="settingsModal"><div class="sheet"><h2>⚙️ Beállítások</h2><p>Az alapértelmezett pénznem az új tételeknél használatos.</p><select id="defaultCurrency" style="width:100%;padding:12px;border-radius:10px;border:1px solid #263750;background:#08111f;color:#fff;margin:7px 0 15px"></select><div class="sheetBtns"><button class="btn" id="sCancel">Mégse</button><button class="btn blue" id="sOk">Mentés</button></div></div></div>
<script>
const KEY='money-pro-v3',OLD='money-pro-v2',PASS='1111',CUR={HUF:['🇭🇺','Ft','Magyar forint',0],EUR:['🇪🇺','€','Euró',2],USD:['🇺🇸','$','Amerikai dollár',2],GBP:['🇬🇧','£','Angol font',2],CHF:['🇨🇭','Fr','Svájci frank',2],JPY:['🇯🇵','¥','Japán jen',0],CNY:['🇨🇳','¥','Kínai jüan',2],AUD:['🇦🇺','A$','Ausztrál dollár',2],CAD:['🇨🇦','C$','Kanadai dollár',2],PLN:['🇵🇱','zł','Lengyel zloty',2],CZK:['🇨🇿','Kč','Cseh korona',2],RON:['🇷🇴','lei','Román lej',2],SEK:['🇸🇪','kr','Svéd korona',2],NOK:['🇳🇴','kr','Norvég korona',2],DKK:['🇩🇰','kr','Dán korona',2],RUB:['🇷🇺','₽','Orosz rubel',2],UAH:['🇺🇦','₴','Ukrán hrivnya',2],TRY:['🇹🇷','₺','Török líra',2],INR:['🇮🇳','₹','Indiai rúpia',2],KRW:['🇰🇷','₩','Dél-koreai von',0],BRL:['🇧🇷','R$','Brazil real',2],MXN:['🇲🇽','Mex$','Mexikói peso',2],ZAR:['🇿🇦','R','Dél-afrikai rand',2],ILS:['🇮🇱','₪','Izraeli sékel',2],AED:['🇦🇪','د.إ','EAE dirham',2],SAR:['🇸🇦','﷼','Szaúdi riál',2],SGD:['🇸🇬','S$','Szingapúri dollár',2],HKD:['🇭🇰','HK$','Hongkongi dollár',2],NZD:['🇳🇿','NZ$','Új-zélandi dollár',2],THB:['🇹🇭','฿','Thai baht',2],BTC:['₿','₿','Bitcoin',8],ETH:['Ξ','Ξ','Ethereum',8]};
const $=id=>document.getElementById(id);let state={defaultCurrency:'HUF',asof:'',items:[]},pending=null;
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x==='object')state=x}catch(e){}if(!Array.isArray(state.items))state.items=[];if(!CUR[state.defaultCurrency])state.defaultCurrency='HUF';if(!state.asof)state.asof=today();state.items=state.items.filter(x=>x&&Number(x.amount)>0&&CUR[x.currency]&&(x.kind==='income'||x.kind==='expense')&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)).map(x=>({id:String(x.id||Date.now()+Math.random()),desc:String(x.desc||x.description||''),amount:Number(x.amount),currency:x.currency,kind:x.kind||x.type,date:x.date}))}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function migrate(){if(localStorage.getItem(KEY))return;try{const old=JSON.parse(localStorage.getItem(OLD));if(old&&Array.isArray(old.items)){state.items=old.items.filter(x=>x&&Number(x.amount)>0&&(x.type==='income'||x.type==='expense')).map(x=>({id:String(x.id||Date.now()+Math.random()),desc:String(x.description||''),amount:Number(x.amount),currency:'HUF',kind:x.type,date:x.date||today()}));save()}}catch(e){}}
function fillSelects(){const opts=Object.keys(CUR).map(c=>'<option value="'+c+'">'+CUR[c][0]+' '+c+'</option>').join('');$('currency').innerHTML=opts;$('defaultCurrency').innerHTML=opts}
function money(n,c){const q=CUR[c]||CUR.HUF,dec=q[3];return n.toLocaleString('hu-HU',{minimumFractionDigits:dec,maximumFractionDigits:dec})+' '+q[1]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const as=state.asof||today();$('asof').value=as;$('date').value=$('date').value||today();const groups={};state.items.filter(x=>x.date<=as).forEach(x=>{groups[x.currency]??={income:0,expense:0};groups[x.currency][x.kind]+=x.amount});const codes=Object.keys(groups).sort((a,b)=>a==='HUF'?-1:b==='HUF'?1:a.localeCompare(b));$('summary').innerHTML=codes.length?codes.map(c=>{const g=groups[c],bal=g.income-g.expense,q=CUR[c];return '<div class="card currency"><div class="chead"><b>'+q[0]+' '+c+'</b><small>'+q[2]+'</small></div><div class="cbody"><div class="cell"><div class="label">Bevétel</div><div class="value income">+'+money(g.income,c)+'</div></div><div class="cell"><div class="label">Kiadás</div><div class="value expense">−'+money(g.expense,c)+'</div></div><div class="cell balance"><div class="label">Egyenleg</div><div class="value '+(bal>0?'positive':bal<0?'negative':'zero')+'">'+money(bal,c)+'</div></div></div></div>'}).join(''):'<div class="card empty">Nincs adat a kiválasztott dátumig.</div>';const sorted=[...state.items].sort((a,b)=>b.date.localeCompare(a.date));$('list').innerHTML=sorted.length?sorted.map(x=>{const future=x.date>today();return '<div class="card tx '+(future?'future':'')+'"><div class="txgrid"><div class="txdesc">'+esc(x.desc)+'</div><div class="txamount '+(x.kind==='income'?'income':'expense')+'">'+(x.kind==='income'?'+':'−')+money(x.amount,x.currency)+'</div><div class="txdate">'+x.date+(future?'<span class="futureBadge">JÖVŐ</span>':'')+'</div><div class="txmeta">'+(x.kind==='income'?'Bevétel':'Kiadás')+' · '+x.currency+'</div></div><button class="delete" data-del="'+x.id+'">🔒 Törlés</button></div>'}).join(''):'<div class="card empty">Még nincs tranzakció.</div>'}
function needPass(action){return new Promise(resolve=>{pending={action,resolve};$('password').value='';$('passwordModal').classList.add('show');setTimeout(()=>$('password').focus(),50)})}
function closePass(v){$('passwordModal').classList.remove('show');if(pending){const r=pending.resolve;pending=null;r(v)}}
function addItem(){const desc=$('desc').value.trim(),amount=Number($('amount').value),date=$('date').value;if(!desc||!(amount>0)||!date){alert('Töltsd ki a leírást, összeget és dátumot.');return}needPass('add').then(ok=>{if(!ok)return;state.items.push({id:String(Date.now()+Math.random()),desc,amount,currency:$('currency').value,kind:$('kind').value,date});save();$('desc').value='';$('amount').value='';$('date').value=today();render()})}
$('add').onclick=addItem;$('today').onclick=()=>{state.asof=today();save();render()};$('asof').onchange=()=>{state.asof=$('asof').value||today();save();render()};$('currency').onchange=()=>{};
$('pCancel').onclick=()=>closePass(false);$('pOk').onclick=()=>closePass($('password').value===PASS);$('password').onkeydown=e=>{if(e.key==='Enter')$('pOk').click()};
$('list').onclick=e=>{const b=e.target.closest('[data-del]');if(!b)return;const id=b.dataset.del;const x=state.items.find(t=>t.id===id);if(!x)return;needPass('delete').then(ok=>{if(!ok)return;state.items=state.items.filter(t=>t.id!==id);save();render()})};
$('clear').onclick=()=>{if(!state.items.length){alert('Nincs mit törölni.');return}if(!confirm('Biztosan törlöd az összes tranzakciót?'))return;needPass('clear').then(ok=>{if(!ok)return;state.items=[];save();render()})};
$('export').onclick=()=>{const out={version:3,exported:new Date().toISOString(),asOfDate:state.asof,defaultCurrency:state.defaultCurrency,transactions:state.items};const u=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='money-pro-3-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('import').onclick=()=>{$('file').value='';$('importModal').classList.add('show')};$('iCancel').onclick=()=>$('importModal').classList.remove('show');$('iOk').onclick=()=>{const f=$('file').files[0];if(!f){alert('Válassz JSON fájlt.');return}needPass('import').then(ok=>{if(!ok)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),arr=Array.isArray(x)?x:(x.transactions||x.items);if(!Array.isArray(arr)||!arr.length)throw Error('Nincs importálható adat');const n=arr.filter(t=>t&&Number(t.amount)>0&&(t.kind==='income'||t.type==='income'||t.kind==='expense'||t.type==='expense')).map(t=>({id:String(t.id||Date.now()+Math.random()),desc:String(t.desc||t.description||''),amount:Number(t.amount),currency:CUR[t.currency]?t.currency:'HUF',kind:t.kind||t.type,date:/^\d{4}-\d{2}-\d{2}$/.test(t.date)?t.date:today()}));if(!n.length)throw Error('Nincs érvényes tranzakció');if(confirm('OK = hozzáadás a meglévőkhöz. Mégse = meglévők cseréje.')){const ids=new Set(state.items.map(t=>t.id));n.forEach(t=>{if(!ids.has(t.id))state.items.push(t)})}else state.items=n;if(x.asOfDate)state.asof=x.asOfDate;save();render();$('importModal').classList.remove('show');alert(n.length+' tranzakció importálva.')}catch(e){alert('Hibás import: '+e.message)}};r.readAsText(f)})};
$('settings').onclick=()=>{$('defaultCurrency').value=state.defaultCurrency;$('settingsModal').classList.add('show')};$('sCancel').onclick=()=>$('settingsModal').classList.remove('show');$('sOk').onclick=()=>{needPass('settings').then(ok=>{if(!ok)return;state.defaultCurrency=$('defaultCurrency').value;save();$('settingsModal').classList.remove('show');alert('Beállítások mentve.')})};
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal').forEach(x=>x.classList.remove('show'))});
load();migrate();fillSelects();$('defaultCurrency').value=state.defaultCurrency;$('currency').value=state.defaultCurrency;$('date').value=today();render();
</script>
</body></html>
