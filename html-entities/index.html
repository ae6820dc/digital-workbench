<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML Entity Lab</title><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:800px;margin:auto;padding:24px}.box{background:#fff;border-radius:18px;padding:20px;border:1px solid #e5e7eb}textarea,button{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:10px}textarea{width:100%;min-height:130px}button{cursor:pointer;margin-top:10px}.out{margin-top:16px;word-break:break-all;line-height:1.8}</style></head><body><main><h1>🏷️ HTML Entity Lab</h1><div class="box"><textarea id="t" placeholder="Írj be karaktereket..."></textarea><button onclick="go()">Kódolás</button><div id="o" class="out"></div></div></main><script>function go(){let s=document.getElementById('t').value,o=document.getElementById('o');o.textContent=[...s].map(c=>'&#'+c.codePointAt(0)+';').join('');}</script></body></html>
