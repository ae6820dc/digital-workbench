<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Password Generator</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#22345a,#0c1220 65%);color:#edf4ff;padding:20px}main{max-width:750px;margin:24px auto;padding:clamp(18px,4vw,32px);border:1px solid #435473;border-radius:22px;background:#151e31;box-shadow:0 20px 70px #0006}h1{margin:0 0 8px;font-size:clamp(25px,5vw,36px)}p{color:#b7c7e0}label{display:block;margin:16px 0 8px;font-weight:650}.inline{display:flex;align-items:center;justify-content:space-between;gap:12px}input[type=number]{width:115px}input[type=number],textarea{background:#0c1526;color:#fff;border:1px solid #546783;border-radius:10px;padding:12px;font-size:17px}input[type=range]{width:100%;accent-color:#67c9ff}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choices label{margin:0;padding:13px;background:#202e46;border-radius:10px;font-weight:500}input[type=checkbox]{accent-color:#55caff;width:18px;height:18px;vertical-align:middle}button{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#6ad1ff;color:#081321}button.secondary{background:#2c3f60;color:#eaf6ff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.password-row{display:flex;align-items:center;gap:8px;padding:8px;margin:8px 0;background:#202e46;border-radius:10px}.password-row code{flex:1;min-width:0;overflow-wrap:anywhere;user-select:all;font-size:14px}.password-row button{flex-shrink:0;padding:10px 12px}.password-list{margin-top:14px;background:#090f1d;border:1px solid #344560;border-radius:16px;padding:12px}.password-row{background:transparent;margin:0;padding:10px 8px;min-height:56px}.password-row code{font-size:clamp(13px,3.5vw,17px);letter-spacing:.3px}.password-row button{background:#2c3a58;color:#f0f6ff;border-radius:11px}.password-index{font-size:15px;min-width:38px}.password-index{color:#a9bedc;min-width:30px;font-size:13px}textarea{width:100%;min-height:160px;resize:vertical;overflow-wrap:anywhere;margin-top:12px;font-family:ui-monospace,monospace;font-size:16px}#status{min-height:25px;color:#a7e8b6}small{color:#afc0d8}input:focus-visible,button:focus-visible{outline:3px solid #ffdc77;outline-offset:2px}@media(max-width:440px){.choices{grid-template-columns:1fr}.actions button{flex:1}}
</style></head><body><main>
<h1>🔐 Password Generator</h1><p>Erős, véletlenszerű jelszavak. A generálás kizárólag a készülékeden történik.</p>
<div class="inline"><label for="length">Jelszó hossza</label><input id="length" type="number" min="1" max="1024" value="24"></div><input id="range" aria-label="Jelszó hossza csúszka" type="range" min="1" max="1024" value="24">
<label>Használható karakterek</label><div class="choices">
<label><input id="lower" type="checkbox" checked> Kisbetűk (a–z)</label>
<label><input id="upper" type="checkbox" checked> Nagybetűk (A–Z)</label>
<label><input id="digits" type="checkbox" checked> Számok (0–9)</label>
<label><input id="special" type="checkbox" checked> Speciális (!@#…)</label></div>
<div class="inline"><label for="count">Jelszavak száma (1–1024)</label><input id="count" type="number" min="1" max="1024" value="1"></div>
<div class="actions"><button id="generate">⚡ Generálás</button><button id="copy" class="secondary">📋 Másolás</button><button id="clear" class="secondary">Törlés</button></div>
<label for="output">Eredmény – minden jelszó külön másolható</label><div id="password-list" class="password-list"></div><details style="margin-top:16px"><summary>Összes jelszó szövegként (opcionális)</summary><textarea id="output" readonly spellcheck="false" placeholder="Itt jelennek meg a jelszavak…"></textarea></details><div id="status" role="status" aria-live="polite"></div>
<small>Web Crypto API • kriptográfiailag biztonságos véletlen • nincs szerver, nincs mentés. Több jelszó esetén soronként egy jelszó jelenik meg.</small>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const sets=[['lower','abcdefghijklmnopqrstuvwxyz'],['upper','ABCDEFGHIJKLMNOPQRSTUVWXYZ'],['digits','0123456789'],['special','!@#$%^&*()-_=+[]{};:,.?/|~']];
const status=message=>$('status').textContent=message;
function bounded(max){const limit=Math.floor(4294967296/max)*max;const a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}
function makePassword(n,selected){const pool=selected.join('');const chars=selected.map(s=>s[bounded(s.length)]);for(let i=chars.length;i<n;i++)chars.push(pool[bounded(pool.length)]);for(let i=chars.length-1;i>0;i--){const j=bounded(i+1);[chars[i],chars[j]]=[chars[j],chars[i]]}return chars.join('')}
async function copyOne(value,button){try{await navigator.clipboard.writeText(value);button.textContent='✓ Másolva';status('Egy jelszó másolva.')}catch{status('A másolás nem sikerült; jelöld ki a jelszót és másold kézzel.')}}
function showPasswords(passwords){const list=$('password-list');list.replaceChildren();passwords.forEach((password,i)=>{const row=document.createElement('div');row.className='password-row';const index=document.createElement('span');index.className='password-index';index.textContent=(i+1)+'.';const code=document.createElement('code');code.textContent=password;const btn=document.createElement('button');btn.className='secondary';btn.textContent='📋 Másolás';btn.setAttribute('aria-label',(i+1)+'. jelszó másolása');btn.addEventListener('click',()=>copyOne(password,btn));row.append(index,code,btn);list.append(row)})}
function clampNumber(id,min,max){const value=Number($(id).value);if(!Number.isInteger(value)||value<min||value>max)throw Error('A(z) '+id+' értéke '+min+' és '+max+' közötti egész szám legyen.');return value}
$('range').addEventListener('input',()=>{$('length').value=$('range').value});
$('length').addEventListener('input',()=>{const v=Number($('length').value);if(Number.isFinite(v))$('range').value=Math.min(1024,Math.max(1,v))});
$('generate').addEventListener('click',()=>{try{if(!globalThis.crypto?.getRandomValues)throw Error('A biztonságos véletlengenerálás nem érhető el. Használj HTTPS-t.');const n=clampNumber('length',1,1024),count=clampNumber('count',1,1024);const selected=sets.filter(([id])=>$(id).checked).map(([,chars])=>chars);if(!selected.length)throw Error('Válassz legalább egy karaktercsoportot.');if(n<selected.length)throw Error('A hossz legalább '+selected.length+' legyen, hogy minden kiválasztott karaktercsoport szerepeljen.');const passwords=Array.from({length:count},()=>makePassword(n,selected));$('output').value=passwords.join('\n');showPasswords(passwords);status(count+' jelszó elkészült. Mindegyik külön másolható.')}catch(e){status('⚠️ '+e.message)}});
$('copy').addEventListener('click',async()=>{if(!$('output').value){status('Előbb generálj jelszót.');return}try{await navigator.clipboard.writeText($('output').value);status('Vágólapra másolva.')}catch{status('A másolás nem sikerült. Jelöld ki a szöveget, és másold kézzel.')}});
$('clear').addEventListener('click',()=>{$('output').value='';$('password-list').replaceChildren();status('Eredmény törölve.')});
</script></body></html>
