<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Visualizer</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:900px;margin:auto;padding:24px}section{background:#fff;padding:20px;border-radius:16px;margin:12px 0}input,select,button{padding:10px;margin:4px;border:1px solid #d1d5db;border-radius:8px}canvas{width:100%;height:420px;border:1px solid #ddd;border-radius:12px}</style></head><body><main><h1>🧮 Math Visualizer</h1><section><label>f(x)= <input id="f" value="Math.sin(x)" size="28"></label><label>Min <input id="a" type="number" value="-10"></label><label>Max <input id="b" type="number" value="10"></label><button onclick="draw()">Rajzolás</button><p>Használható: Math.sin(x), Math.cos(x), Math.tan(x), Math.sqrt(Math.abs(x)), Math.log(Math.abs(x)+1), x*x</p></section><canvas id="c" width="850" height="420"></canvas></main><script>function draw(){let c=document.querySelector('canvas'),x=c.getContext('2d'),w=c.width,h=c.height,a=+document.getElementById('a').value,b=+document.getElementById('b').value,f=document.getElementById('f').value;x.clearRect(0,0,w,h);x.strokeStyle='#ddd';x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();let ys=[];for(let i=0;i<w;i++){let z=a+(b-a)*i/w;try{ys.push(Function('x','return '+f)(z))}catch{ys.push(NaN)}}let m=Math.max(1,...ys.filter(Number.isFinite).map(v=>Math.abs(v)));x.strokeStyle='#2563eb';x.beginPath();ys.forEach((v,i)=>{if(!Number.isFinite(v)||Math.abs(v)>m*10)return;let y=h/2-v/m*(h*.45);i?x.lineTo(i,y):x.moveTo(i,y)});x.stroke()}draw()</script></body></html>
