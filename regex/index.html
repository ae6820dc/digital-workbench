<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regex Lab</title><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:800px;margin:auto;padding:24px}.box{background:#fff;border-radius:18px;padding:20px;border:1px solid #e5e7eb}input,textarea,button{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:10px}input,textarea{width:100%;margin-bottom:10px}textarea{min-height:140px}button{cursor:pointer}.out{margin-top:16px;line-height:1.8}</style></head><body><main><h1>🧪 Regex Lab</h1><div class="box"><input id="p" value="^[A-Z][a-z]+$" placeholder="Reguláris kifejezés"><textarea id="t" placeholder="Tesztelendő szöveg"></textarea><button onclick="go()">Tesztelés</button><div id="o" class="out"></div></div></main><script>function go(){let o=document.getElementById('o');try{let r=new RegExp(document.getElementById('p').value),t=document.getElementById('t').value,m=t.match(r);o.innerHTML='Érvényes regex.<br>Első találat: <b>'+(m?m[0]:'nincs')+'</b><br>Teljes egyezés: <b>'+r.test(t)+'</b>'}catch(e){o.textContent='Hibás regex: '+e.message}}</script></body></html>
