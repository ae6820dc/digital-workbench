<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Lab</title><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:700px;margin:auto;padding:24px}.box{background:#fff;border-radius:18px;padding:20px;border:1px solid #e5e7eb}input,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #cbd5e1}input{width:100%}button{margin-top:10px;cursor:pointer}.out{margin-top:16px;line-height:1.7}</style></head><body><main><h1>🧮 Prime Lab</h1><div class="box"><input id="n" type="number" placeholder="Határérték, pl. 100"><button onclick="go()">Prímszámok keresése</button><div id="o" class="out"></div></div></main><script>function prime(n){if(n<2)return false;if(n%2===0)return n===2;for(let i=3;i*i<=n;i+=2)if(n%i===0)return false;return true}function go(){let n=Math.floor(+document.getElementById('n').value),o=document.getElementById('o');if(!Number.isFinite(n)||n<2||n>100000){o.textContent='Adj meg 2 és 100000 közötti értéket.';return}let a=[];for(let i=2;i<=n;i++)if(prime(i))a.push(i);o.innerHTML='Darabszám: <b>'+a.length+'</b><br>'+a.join(', ');}</script></body></html>
