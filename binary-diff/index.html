<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Diff</title><style>
body{margin:0;background:#0b1016;color:#e4edf5;font:14px system-ui;padding:18px}main{max-width:1100px;margin:auto}.files{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#121a23;border:1px solid #2a3948;border-radius:14px;padding:14px;margin:12px 0}.pick{display:block;border:2px dashed #40566b;padding:20px;border-radius:12px;text-align:center;cursor:pointer}input{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#19232e;border-radius:10px;padding:12px}.num{font-size:22px;font-family:monospace}pre{white-space:pre;overflow:auto;background:#090d12;padding:12px;border-radius:10px;max-height:500px;font:12px ui-monospace,monospace}.d{font-weight:700}.muted{color:#91a4b7}@media(max-width:700px){.files,.stats{grid-template-columns:1fr 1fr}}</style></head><body><main><h1>⚖️ Binary Diff</h1><p class=muted>Két fájl byte-szintű összehasonlítása.</p><div class=files><div class=panel><label class=pick>📄 Fájl A<input id=a type=file></label><p id=an></p></div><div class=panel><label class=pick>📄 Fájl B<input id=b type=file></label><p id=bn></p></div></div><div class=panel><div class=stats id=s></div></div><div class=panel><pre id=o>Válaszd ki mindkét fájlt.</pre></div></main><script>
let A,B;a.onchange=()=>read(a.files[0],1);b.onchange=()=>read(b.files[0],2);function read(f,n){if(!f)return;document.querySelector(n==1?'#an':'#bn').textContent=f.name+' · '+f.size.toLocaleString()+' byte';let r=new FileReader;r.onload=()=>{n==1?A=new Uint8Array(r.result):B=new Uint8Array(r.result);if(A&&B)go()};r.readAsArrayBuffer(f)}
function go(){let len=Math.max(A.length,B.length),changed=0,bit=0,lines=[],limit=Math.min(len,8192);for(let i=0;i<len;i++){let x=A[i]??null,y=B[i]??null;if(x!==y){changed++;if(x!==null&&y!==null)bit+=pop(x^y);if(i<limit)lines.push(i.toString(16).padStart(8,'0').toUpperCase()+'  '+(x===null?'--':x.toString(16).padStart(2,'0').toUpperCase())+' → '+(y===null?'--':y.toString(16).padStart(2,'0').toUpperCase())+'  ✦ DIFFERENCE')}}document.querySelector('#s').innerHTML='<div class=stat>Eltérő byte-ok<div class=num>'+changed.toLocaleString()+'</div></div><div class=stat>Eltérő bitek<div class=num>'+bit.toLocaleString()+'</div></div><div class=stat>Közös hossz<div class=num>'+Math.min(A.length,B.length).toLocaleString()+'</div></div><div class=stat>Max. hossz<div class=num>'+len.toLocaleString()+'</div></div>';o.textContent=lines.length?lines.join('\n'):'A két fájl byte-ról byte-ra azonos.'}
function pop(x){let n=0;while(x){n+=x&1;x>>=1}return n}</script></body></html>
