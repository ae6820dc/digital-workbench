<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Bit Depth</title><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:700px;margin:auto;padding:24px}.box{background:#fff;border-radius:18px;padding:20px;border:1px solid #e5e7eb}input,button{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:10px}input{width:100%}button{margin-top:10px;cursor:pointer}.out{margin-top:16px;line-height:1.8}</style></head><body><main><h1>🟦 Pixel Bit Depth</h1><div class="box"><input id="b" type="number" value="8" min="1" max="32"><button onclick="go()">Számolás</button><div id="o" class="out"></div></div></main><script>function go(){let b=+document.getElementById('b').value,o=document.getElementById('o');if(b<1||b>32){o.textContent='1–32 bit között adj meg értéket.';return}let levels=2**b;o.innerHTML='Bitmélység: <b>'+b+' bit</b><br>Szint/csatorna: <b>'+levels.toLocaleString('hu-HU')+'</b><br>RGB kombinációk: <b>'+((2**b)**3).toLocaleString('hu-HU')+'</b>';}</script></body></html>
