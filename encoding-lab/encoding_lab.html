<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encoding Lab</title><style>body{font-family:system-ui;margin:0;background:#eef1f5;color:#172033}main{max-width:900px;margin:auto;padding:20px}section{background:#fff;padding:20px;border-radius:16px;margin:12px 0}textarea,button{padding:10px;border:1px solid #ccd3dc;border-radius:9px;font:inherit}textarea{width:100%;box-sizing:border-box;min-height:100px}pre{white-space:pre-wrap;word-break:break-all;background:#f5f6f8;padding:12px;border-radius:10px}</style></head><body><main><h1>🔐 Encoding Lab</h1><section><textarea id="s">Hello 🌍 Á</textarea><button onclick="go()">Elemzés</button><pre id="o"></pre></section></main><script>function go(){let s=txt.value,enc=new TextEncoder(),u=enc.encode(s),c=[...s].map(x=>x.codePointAt(0).toString(16).toUpperCase().padStart(4,'0'));o.textContent='Karakterek: '+[...s].length+'\nUTF-8 bájtok: '+u.length+'\n\nCode pointok (hex):\n'+c.join(' ')+'\n\nUTF-8 (hex):\n'+[...u].map(x=>x.toString(16).padStart(2,'0').toUpperCase()).join(' ')}const txt=document.getElementById('s');go()</script></body></html>
