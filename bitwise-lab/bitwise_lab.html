<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bitwise Lab</title><style>body{font-family:system-ui;margin:0;background:#eef1f5;color:#172033}main{max-width:850px;margin:auto;padding:20px}section{background:#fff;padding:20px;border-radius:16px;margin:12px 0}input,select,button{padding:10px;border:1px solid #ccd3dc;border-radius:9px;font:inherit}.bits{font-family:monospace;font-size:1.3rem;word-break:break-all;background:#f5f6f8;padding:14px;border-radius:10px}</style></head><body><main><h1>🧠 Bitwise Lab</h1><section><input id="a" type="number" value="42"><select id="op"><option>AND</option><option>OR</option><option>XOR</option><option>NOT</option><option>LSHIFT</option><option>RSHIFT</option></select><input id="b" type="number" value="15"><button onclick="go()">Számol</button><div id="r"></div></section></main><script>function bits(x){return (x>>>0).toString(2).padStart(32,'0').replace(/(.{8})/g,'$1 ')}function go(){let a=Number(aEl.value)|0,b=Number(bEl.value)|0,o=op.value,x=o==='AND'?a&b:o==='OR'?a|b:o==='XOR'?a^b:o==='NOT'?~a:o==='LSHIFT'?a<<b:a>>b;r.innerHTML='<p>Eredmény: <b>'+x+'</b></p><div class="bits">'+bits(x)+'</div><p>Hex: 0x'+(x>>>0).toString(16).toUpperCase()+'</p>'}const aEl=document.getElementById('a'),bEl=document.getElementById('b'),op=document.getElementById('op');go()</script></body></html>
