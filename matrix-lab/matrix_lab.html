<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matrix Lab</title><style>body{font-family:system-ui;margin:0;background:#eef1f5;color:#172033}main{max-width:900px;margin:auto;padding:20px}section{background:#fff;padding:20px;border-radius:16px;margin:12px 0}input,button{padding:9px;border:1px solid #ccd3dc;border-radius:8px;font:inherit}table{border-collapse:collapse;margin:10px 0}td{padding:4px}td input{width:65px}.grid{display:flex;gap:20px;flex-wrap:wrap}.out{background:#f5f6f8;padding:12px;border-radius:12px}</style></head><body><main><h1>📐 Matrix Lab</h1><section><p>2×2 mátrixok: A és B</p><div class="grid"><div><b>A</b><div id="A"></div></div><div><b>B</b><div id="B"></div></div></div><button onclick="calc()">A+B és A×B</button><div class="out" id="o"></div></section></main><script>function mat(id){let d=document.getElementById(id),t=document.createElement('table');for(let i=0;i<2;i++){let tr=t.insertRow();for(let j=0;j<2;j++){let td=tr.insertCell(),x=document.createElement('input');x.type='number';x.value=i===j?1:0;x.id=id+i+j;td.append(x)}}d.append(t)}mat('A');mat('B');function M(id){return [[+document.getElementById(id+'00').value,+document.getElementById(id+'01').value],[+document.getElementById(id+'10').value,+document.getElementById(id+'11').value]]}function calc(){let a=M('A'),b=M('B'),s=[[a[0][0]+b[0][0],a[0][1]+b[0][1]],[a[1][0]+b[1][0],a[1][1]+b[1][1]]],p=[[a[0][0]*b[0][0]+a[0][1]*b[1][0],a[0][0]*b[0][1]+a[0][1]*b[1][1]],[a[1][0]*b[0][0]+a[1][1]*b[1][0],a[1][0]*b[0][1]+a[1][1]*b[1][1]]];o.textContent='A+B = '+JSON.stringify(s)+'\nA×B = '+JSON.stringify(p)+'\ndet(A) = '+(a[0][0]*a[1][1]-a[0][1]*a[1][0])}calc()</script></body></html>
