<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Inspector</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#dce7f2;font:14px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1100px;margin:auto;padding:18px}h1{margin:0 0 4px;font-size:26px}p{color:#8fa3b7}.bar,.panel{background:#111923;border:1px solid #263544;border-radius:14px;padding:14px;margin:12px 0}.drop{border:2px dashed #3c5267;border-radius:12px;padding:25px;text-align:center;cursor:pointer}.drop:hover{border-color:#7da4c7}input[type=file]{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hex{font:13px ui-monospace,monospace;line-height:1.7;white-space:pre;overflow:auto;max-height:430px;background:#090d12;padding:12px;border-radius:10px}.sel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cell{background:#18222d;border:1px solid #2b3c4d;border-radius:10px;padding:10px}.v{font:20px ui-monospace,monospace}.muted{color:#8396a9}.bits{display:flex;gap:5px;flex-wrap:wrap}.bit{padding:7px 9px;background:#1b2733;border-radius:7px;font-family:monospace}.hot{outline:2px solid #7da4c7}@media(max-width:700px){.grid{grid-template-columns:1fr}.sel{grid-template-columns:1fr 1fr}}
</style></head><body><main><h1>🔬 Binary Inspector</h1><p>HEX → BYTE → BIT → ASCII → DECIMAL → BINARY. Kattints egy byte-ra.</p>
<div class="bar"><label class="drop" id="drop">📂 Fájl kiválasztása vagy húzd ide<input id="file" type="file"></label></div>
<div class="panel"><b id="name">Nincs fájl</b><span id="meta" class="muted"></span></div>
<div class="grid"><section class="panel"><h3>Byte nézet</h3><div id="hex" class="hex">Tölts be egy fájlt.</div></section><section class="panel"><h3>Kiválasztott byte</h3><div class="sel" id="info"></div><h4>8 bit</h4><div class="bits" id="bits"></div></section></div></main>
<script>
const f=document.querySelector('#file'),d=document.querySelector('#drop'),hex=document.querySelector('#hex'),info=document.querySelector('#info'),bits=document.querySelector('#bits');let data=[];
f.onchange=e=>load(e.target.files[0]);d.ondragover=e=>{e.preventDefault()};d.ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
function load(file){if(!file)return;document.querySelector('#name').textContent=file.name;document.querySelector('#meta').textContent=' · '+file.size.toLocaleString()+' byte · '+(file.type||'ismeretlen');const r=new FileReader;r.onload=()=>{data=new Uint8Array(r.result);render()};r.readAsArrayBuffer(file)}
function render(){let n=Math.min(data.length,4096),s='';for(let i=0;i<n;i+=16){let h='',a='';for(let j=0;j<16;j++){if(i+j<n){let x=data[i+j];h+=x.toString(16).padStart(2,'0')+' ';a+=x>=32&&x<127?String.fromCharCode(x):'.'}else{h+='   ';a+=' '}}s+=i.toString(16).padStart(8,'0')+'  '+h+' | '+a+'\n'}hex.textContent=s; if(data.length) select(0)}
function select(i){if(i>=data.length)return;document.querySelectorAll('.byte').forEach(x=>x.classList.remove('hot'));let x=data[i],ascii=x>=32&&x<127?String.fromCharCode(x):'·';info.innerHTML='<div class=cell><span class=muted>Offset</span><div class=v>0x'+i.toString(16).toUpperCase()+'</div></div><div class=cell><span class=muted>HEX</span><div class=v>'+x.toString(16).padStart(2,'0').toUpperCase()+'</div></div><div class=cell><span class=muted>DECIMAL</span><div class=v>'+x+'</div></div><div class=cell><span class=muted>ASCII</span><div class=v>'+ascii+'</div></div>';bits.innerHTML=x.toString(2).padStart(8,'0').split('').map((b,k)=>'<span class=bit>'+b+'</span>').join('')}
</script></body></html>
