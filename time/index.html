<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Lab</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.wrap{max-width:700px;margin:auto;padding:25px 16px}a{color:#2563eb;text-decoration:none}input{font:inherit;padding:12px;width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px;margin:5px 0 12px}.out{background:white;padding:18px;border-radius:14px;line-height:1.8}</style></head><body><div class="wrap"><a href="../">← Workbench</a><h1>⏱️ Time Lab</h1><label>Első időpont</label><input id="a" type="datetime-local"><label>Második időpont</label><input id="b" type="datetime-local"><div id="o" class="out"></div></div><script>function go(){let A=new Date(a.value),B=new Date(b.value);if(!a.value||!b.value){o.textContent='Válassz két időpontot.';return}let ms=Math.abs(B-A),sec=ms/1000; o.innerHTML='<b>Különbség:</b> '+sec.toLocaleString()+' másodperc<br><b>Óra:</b> '+(sec/3600).toFixed(4)+'<br><b>Nap:</b> '+(sec/86400).toFixed(6); }a.oninput=b.oninput=go;</script></body></html>
