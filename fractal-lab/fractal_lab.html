<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fractal Lab</title><style>body{font-family:system-ui;margin:0;background:#eef1f5;color:#172033}main{max-width:900px;margin:auto;padding:20px}section{background:#fff;padding:20px;border-radius:16px;margin:12px 0}input,button{padding:10px;border:1px solid #ccd3dc;border-radius:9px;font:inherit}canvas{width:100%;max-height:650px;image-rendering:auto;background:#000;border-radius:12px}</style></head><body><main><h1>🌀 Fractal Lab</h1><section><label>Iteráció <input id="it" type="number" min="20" max="1000" value="180"></label><button onclick="draw()">Render</button><canvas id="c" width="700" height="500"></canvas></section></main><script>function draw(){let ctx=c.getContext('2d'),w=c.width,h=c.height,img=ctx.createImageData(w,h),max=+it.value;for(let y=0;y<h;y++)for(let x=0;x<w;x++){let cr=(x-w/2)*4/w,ci=(y-h/2)*4/h,zr=0,zi=0,i=0;for(;i<max&&zr*zr+zi*zi<=4;i++){let q=zr*zr-zi*zi+cr;zi=2*zr*zi+ci;zr=q}let p=(y*w+x)*4,v=i===max?0:Math.floor(255*i/max);img.data[p]=v;img.data[p+1]=v;img.data[p+2]=v;img.data[p+3]=255}ctx.putImageData(img,0,0)}draw()</script></body></html>
