<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Big Number Lab</title><style>body{font-family:system-ui;margin:0;background:#eef1f5;color:#172033}main{max-width:850px;margin:auto;padding:20px}section{background:white;padding:20px;border-radius:16px;margin:12px 0}input,select,button{padding:10px;border:1px solid #ccd3dc;border-radius:9px;font:inherit}.row{display:flex;gap:10px;flex-wrap:wrap}.result{margin-top:14px;padding:14px;background:#f5f6f8;border-radius:12px;word-break:break-all;font-size:1.1rem}</style></head><body><main><h1>🔢 Big Number Lab</h1><section><input id="a" value="12345678901234567890"><select id="op"><option>+</option><option>-</option><option>*</option><option>**</option></select><input id="b" value="987654321"><button onclick="go()">Számol</button><div class="result" id="r"></div></section><section><input id="f" type="number" min="0" value="100"><button onclick="fac()">n! számítása</button><div class="result" id="fr"></div></section></main><script>function go(){try{let a=BigInt(aEl.value),b=BigInt(bEl.value),o=op.value,x=o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:a**b;r.textContent=x.toString()+'  |  '+x.toString().length+' számjegy'}catch(e){r.textContent='Érvénytelen egész szám vagy túl nagy kitevő'}}const aEl=document.getElementById('a'),bEl=document.getElementById('b'),op=document.getElementById('op');function fac(){let n=+f.value;if(n>10000){fr.textContent='10000 fölé a megjelenítés miatt nem megyünk.';return}let x=1n;for(let i=2;i<=n;i++)x*=BigInt(i);fr.textContent=x.toString()+'  |  '+x.toString().length+' számjegy'}go()</script></body></html>
