<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Precision Lab</title><style>body{font-family:system-ui;margin:0;background:#eef1f5;color:#172033}main{max-width:850px;margin:auto;padding:20px}section{background:#fff;padding:20px;border-radius:16px;margin:12px 0}.v{padding:12px;background:#f5f6f8;border-radius:10px;margin-top:10px;word-break:break-all}input,button{padding:10px;border:1px solid #ccd3dc;border-radius:9px;font:inherit}</style></head><body><main><h1>⏱️ Time Precision Lab</h1><section><input id="ms" type="number" value="1000"><button onclick="go()">Átváltás</button><div id="o"></div></section><section><p>JavaScript Date alapú Unix idő:</p><div class="v" id="now"></div></section></main><script>function go(){let x=Number(ms.value);o.innerHTML='<div class="v">'+x+' ms</div><div class="v">'+(x/1000)+' s</div><div class="v">'+(x/86400000)+' nap</div><div class="v">'+(x/31557600000)+' év (365.25 nap)</div>'}function tick(){now.textContent=Date.now()+' ms since Unix epoch | '+new Date().toISOString()}go();tick();setInterval(tick,1000)</script></body></html>
