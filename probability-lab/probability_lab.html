<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Probability Lab</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:800px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:16px}input,button{padding:10px;margin:5px}pre{font-family:monospace}</style></head><body><main><h1>🎲 Probability Lab</h1><section><input id="n" type="number" value="10000" min="1" max="1000000"><button onclick="go()">Dobás</button><pre id="o"></pre></section></main><script>function go(){let n=+document.getElementById('n').value,c=Array(7).fill(0);for(let i=0;i<n;i++)c[1+Math.floor(Math.random()*6)]++;o.textContent=c.slice(1).map((v,i)=>i+1+': '+v+' '+('█'.repeat(Math.round(v/n*60))).replaceAll('█','▉')).join('\n')}</script></body></html>
