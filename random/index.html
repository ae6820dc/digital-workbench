<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Lab</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.wrap{max-width:700px;margin:auto;padding:25px 16px}a{color:#2563eb;text-decoration:none}input,button{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:10px}input{width:100%;box-sizing:border-box;margin:5px 0 10px}button{background:#172033;color:white}.result{font-size:42px;text-align:center;background:white;border-radius:14px;padding:25px;margin-top:15px}</style></head><body><div class="wrap"><a href="../">← Workbench</a><h1>🎲 Random Lab</h1><input id="min" type="number" value="1" placeholder="Minimum"><input id="max" type="number" value="100" placeholder="Maximum"><button onclick="roll()">Sorsolás</button><div id="r" class="result">?</div></div><script>function roll(){let a=+min.value,b=+max.value;if(a>b)[a,b]=[b,a];r.textContent=Math.floor(Math.random()*(b-a+1))+a}</script></body></html>
