<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stopwatch Lab</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033;text-align:center}main{max-width:700px;margin:auto;padding:30px}section{background:white;padding:30px;border-radius:16px}#t{font-size:48px;margin:20px}button{padding:12px 18px;margin:4px;border:1px solid #ddd;border-radius:8px}</style></head><body><main><h1>🕐 Stopwatch Lab</h1><section><div id="t">00:00.000</div><button onclick="start()">Start</button><button onclick="lap()">Lap</button><button onclick="stop()">Stop</button><button onclick="reset()">Reset</button><ol id="l"></ol></section></main><script>let st=0,timer=null;function fmt(ms){return new Date(ms).toISOString().substr(14,9)}function tick(){t.textContent=fmt(performance.now()-st)}function start(){if(timer)return;st=performance.now()-(st?elapsed:0);timer=setInterval(()=>{elapsed=performance.now()-st;tick()},10)}let elapsed=0;function stop(){clearInterval(timer);timer=null}function lap(){let li=document.createElement('li');li.textContent=t.textContent;l.appendChild(li)}function reset(){stop();st=elapsed=0;t.textContent='00:00.000';l.innerHTML=''}reset()</script></body></html>
