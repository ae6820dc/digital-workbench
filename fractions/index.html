<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fraction Lab</title><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f3f4f6;color:#172033}main{max-width:700px;margin:auto;padding:24px}h1{margin-top:0}.box{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 4px 14px #0001}input,button{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:10px}input{width:45%}button{cursor:pointer;margin-top:12px}.result{margin-top:18px;line-height:1.8;font-size:17px}</style></head><body><main><h1>➗ Fraction Lab</h1><div class="box"><input id="a" type="number" step="any" placeholder="Számláló"> / <input id="b" type="number" step="any" placeholder="Nevező"><br><button onclick="calc()">Számolás</button><div id="r" class="result"></div></div></main><script>function gcd(a,b){while(b){[a,b]=[b,a%b]}return Math.abs(a)}function calc(){let a=Number(document.getElementById('a').value),b=Number(document.getElementById('b').value),r=document.getElementById('r');if(!Number.isFinite(a)||!Number.isFinite(b)||b===0){r.textContent='Adj meg érvényes számokat!';return}let v=a/b,g=gcd(Math.abs(a),Math.abs(b));r.innerHTML='Érték: <b>'+v+'</b><br>Egyszerűsítve: <b>'+a/g+'/'+b/g+'</b><br>Százalék: <b>'+(v*100)+'</b>%';}</script></body></html>
