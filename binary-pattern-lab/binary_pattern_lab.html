<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Pattern Lab</title><style>body{font-family:system-ui;margin:0;background:#eef1f5;color:#172033}main{max-width:850px;margin:auto;padding:20px}section{background:#fff;padding:20px;border-radius:16px;margin:12px 0}input,button{padding:10px;border:1px solid #ccd3dc;border-radius:9px;font:inherit}.bits{font:1.5rem monospace;word-break:break-all;background:#f5f6f8;padding:16px;border-radius:12px;letter-spacing:2px}</style></head><body><main><h1>🧬 Binary Pattern Lab</h1><section><input id="n" type="number" min="0" value="255"><button onclick="go()">Vizsgálat</button><div id="r"></div></section></main><script>function go(){let n=BigInt(nEl.value),s=n.toString(2),ones=[...s].filter(x=>x==='1').length,p=s===s.split('').reverse().join('');r.innerHTML='<div class="bits">'+s+'</div><p>Bináris hossza: '+s.length+' bit</p><p>1 bitek: '+ones+' | 0 bitek: '+(s.length-ones)+'</p><p>Palindrom bitminta: '+(p?'igen':'nem')+'</p><p>2 hatványa: '+(n>0n&&(n&(n-1n))===0n?'igen':'nem')+'</p>'}const nEl=document.getElementById('n');go()</script></body></html>
