<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bit & Byte Lab</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.wrap{max-width:700px;margin:auto;padding:25px 16px}a{color:#2563eb;text-decoration:none}input,select{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:10px;width:100%;margin:6px 0 12px}.out{background:white;padding:18px;border-radius:14px;line-height:1.8}</style></head><body><div class="wrap"><a href="../">← Workbench</a><h1>💾 Bit & Byte Lab</h1><input id="v" type="number" min="0" step="any" value="1"><select id="u"><option value="bit">bit</option><option value="byte">byte</option><option value="KB">KB (1000)</option><option value="KiB">KiB (1024)</option><option value="MB">MB (1000)</option><option value="MiB">MiB (1024)</option><option value="GB">GB (1000)</option><option value="GiB">GiB (1024)</option></select><div id="o" class="out"></div></div><script>const f={bit:1/8,byte:1,KB:1000,KiB:1024,MB:1e6,MiB:1048576,GB:1e9,GiB:1073741824};function go(){let b=+v.value*f[u.value];o.innerHTML='<b>Byte:</b> '+b.toLocaleString()+'<br><b>Bit:</b> '+(b*8).toLocaleString()+'<br><b>KB:</b> '+(b/1e3).toLocaleString()+'<br><b>KiB:</b> '+(b/1024).toLocaleString()+'<br><b>MB:</b> '+(b/1e6).toLocaleString()+'<br><b>MiB:</b> '+(b/1048576).toLocaleString();}v.oninput=u.onchange=go;go();</script></body></html>
